  --bg:#f3f6f9; --card:#fff; --text:#1a2430; --muted:#5d6b7a; --border:#d8e0e8;
  --accent:#0b6e8a; --accent2:#0e8f6e; --ok:#1e8e3e; --okbg:#e7f6ec; --bad:#c62828; --badbg:#fdecea;
  --skip:#8a6d00; --skipbg:#fff7d6; --sel:#e3f2f7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10161c; --card:#19222b; --text:#e6edf3; --muted:#9aa8b6; --border:#2c3946;
    --accent:#4fb3d1; --accent2:#3fc79d; --ok:#5bd17d; --okbg:#173823; --bad:#ff7b72; --badbg:#3d1d1d;
    --skip:#e6c34a; --skipbg:#3a3214; --sel:#1d3440; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans Bengali","Hind Siliguri","Kalpurush","SolaimanLipi","Nirmala UI",system-ui,sans-serif;
  font-size:16px;line-height:1.55}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--accent);padding:10px 14px}
.brand{color:#fff;text-decoration:none;font-weight:700;font-size:18px}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:16px 10px 28px}
.center{text-align:center}.muted{color:var(--muted)}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:18px;margin:22px 0 10px}
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 12px 14px;margin:14px 0}
.section h2{margin:0 0 10px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 14px;
  border-radius:10px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;
  font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
.btn.fill{background:var(--accent);color:#fff}
.btn.green{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn small{font-weight:400;opacity:.8;font-size:12px}
.btn:disabled{opacity:.5}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .btn{flex:1 1 70px}
.testhead{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.testhead input{width:100%;min-height:44px;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text)}
.bar{position:sticky;top:46px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:600}
.timer.low{color:var(--bad)}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0}
.q .qt{font-weight:600;margin-bottom:8px}
.q .src{font-size:12px;color:var(--muted);font-weight:400}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--text);
  border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer;min-height:46px}
.opt .l{font-weight:700;min-width:1.6em}
.opt.sel{border-color:var(--accent);background:var(--sel)}
.locked .opt{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.q.isright{border-left:6px solid var(--ok)}
.q.iswrong{border-left:6px solid var(--bad)}
.q.isskip{border-left:6px solid var(--skip)}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;margin-left:6px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.skip{background:var(--skipbg);color:var(--skip)}
.exp{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--bg);border:1px dashed var(--border);font-size:15px}
.exp b{color:var(--ok)}
textarea{width:100%;min-height:110px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.result{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:14px;margin:14px 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{border-radius:12px;padding:10px 4px}
.stat .n{font-size:26px;font-weight:700;line-height:1.2}
.stat.ok{background:var(--okbg);color:var(--ok)}.stat.bad{background:var(--badbg);color:var(--bad)}.stat.skip{background:var(--skipbg);color:var(--skip)}
.hidden{display:none!important}
.note{font-size:14px;color:var(--muted)}
</style>
</head>

window.QDATA = {"items":[{"id":"1-1","paper":1,"n":1,"q":"কাজের শেষে যে মালামাল ব্যবহারের অনুপযোগী থাকে তাকে কী বলে?","options":["ওয়েস্ট মালামাল","ভালো মালামাল","নতুন মালামাল","প্যাকেট মালামাল"],"answer":0,"explain":"কাজ শেষে যে মালামাল আর ব্যবহার করা যায় না, তা বর্জ্য বা ওয়েস্ট মালামাল। এগুলো আলাদা করে নির্দিষ্ট জায়গায় ফেলতে হয়, যাতে কর্মস্থল নিরাপদ ও পরিষ্কার থাকে।"},{"id":"1-2","paper":1,"n":2,"q":"সাইটে কাজ করতে গেলে কোনো দুর্ঘটনা ঘটলে প্রথমে কাকে জানাতে হবে?","options":["সাইট সুপারভাইজার","চেয়ারম্যান","ডিরেক্টর","যুগ্মসচিব"],"answer":0,"explain":"সাইটে কাজের সরাসরি দায়িত্বে থাকেন সাইট সুপারভাইজার। দুর্ঘটনা ঘটলে তাঁকেই প্রথমে জানাতে হয়, তিনি প্রাথমিক চিকিৎসা ও পরবর্তী ব্যবস্থা নেন।"},{"id":"1-3","paper":1,"n":3,"q":"সাইটে কোথায় কী আছে তা বোঝার জন্য কোন সাইন ব্যবহার করা হয়?","options":["ট্রাফিক সাইন","ফায়ার সাইন","লোকেশন সাইন","বিপদ সাইন"],"answer":2,"explain":"লোকেশন সাইন দেখিয়ে দেয় কোথায় কী আছে, যেমন অফিস, স্টোর, প্রাথমিক চিকিৎসা বা বের হওয়ার পথ। অন্য সাইনগুলো সতর্কতা বা আগুন সংক্রান্ত তথ্য দেয়।"},{"id":"1-4","paper":1,"n":4,"q":"কাজের জায়গায় মালামাল ছড়িয়ে ছিটিয়ে থাকলে কী তৈরি হতে পারে?","options":["কাজের সুব্যবস্থা","হ্যাজার্ড","ভালো পরিবেশ","কাজের উপযোগী পরিবেশ"],"answer":1,"explain":"ছড়ানো মালামালে পা বেধে পড়ে যাওয়া, কেটে যাওয়ার মতো দুর্ঘটনা ঘটতে পারে। তাই এটি একটি হ্যাজার্ড বা ঝুঁকি; কাজের জায়গা সবসময় গুছিয়ে রাখতে হয়।"},{"id":"1-5","paper":1,"n":5,"q":"কাজের জায়গা পরিষ্কার করার জন্য নিচের কোনটি ব্যবহার করা হয়?","options":["প্লাস্টিক ব্রাশ","টুথ ব্রাশ","পেইন্টিং ব্রাশ","ঝাড়ু"],"answer":3,"explain":"মেঝে ও কাজের জায়গার ধুলা, টুকরো মালামাল পরিষ্কারের সাধারণ উপকরণ ঝাড়ু। টুথ ব্রাশ বা পেইন্টিং ব্রাশ ছোট বা ভিন্ন কাজের জন্য।"},{"id":"1-6","paper":1,"n":6,"q":"কোনটি ফিক্সচার?","options":["পাইপ কাটার","ওয়াশ বেসিন","ডাইস্টক","সকেট"],"answer":1,"explain":"ফিক্সচার হলো স্থায়ীভাবে বসানো ব্যবহারের যন্ত্র, যেমন বেসিন, কমোড, সিংক। পাইপ কাটার ও ডাইস্টক টুলস, আর সকেট একটি ফিটিংস।"},{"id":"1-7","paper":1,"n":7,"q":"পানির প্রবাহ বন্ধ এবং খোলার জন্য কী ব্যবহার করা হয়?","options":["ক্রস","এলবো","ভালভ","নিপল"],"answer":2,"explain":"ভালভ পাইপ লাইনে পানির প্রবাহ খোলা, বন্ধ বা নিয়ন্ত্রণ করে। ক্রস, এলবো ও নিপল শুধু পাইপ জোড়া বা দিক পরিবর্তনের ফিটিংস।"},{"id":"1-8","paper":1,"n":8,"q":"ড্রয়িং কে করেন?","options":["প্লাম্বার","লেবার","ইঞ্জিনিয়ার","পেইন্টার"],"answer":2,"explain":"প্লাম্বিং লাইনের নকশা বা ড্রয়িং তৈরি করেন ইঞ্জিনিয়ার। প্লাম্বার সেই ড্রয়িং দেখে অনুসরণ করে কাজ করেন।"},{"id":"1-9","paper":1,"n":9,"q":"কোন পাইপ প্যাঁচ ছাড়া জোড়া দেওয়া যায়?","options":["জি আই পাইপ","এম এস পাইপ","পিভিসি থ্রেড পাইপ","পিভিসি পাইপ"],"answer":3,"explain":"সাধারণ পিভিসি পাইপ সলভেন্ট সিমেন্ট (আঠা) দিয়ে জোড়া দেওয়া হয়, প্যাঁচ লাগে না। জিআই, এমএস ও থ্রেড পাইপে প্যাঁচ কেটে জোড়া দিতে হয়।"},{"id":"1-10","paper":1,"n":10,"q":"লিকপ্রুফ করার জন্য কোনটি ব্যবহার করা হয়?","options":["টেফলন টেপ","মেজারিং টেপ","স্টিল টেপ","বিব ট্যাপ"],"answer":0,"explain":"প্যাঁচের জোড়ায় টেফলন টেপ পেঁচালে ফাঁক বন্ধ হয়ে পানি চুঁইয়ে পড়ে না। মেজারিং ও স্টিল টেপ মাপার জন্য, বিব ট্যাপ একটি কল।"},{"id":"1-11","paper":1,"n":11,"q":"ওভারফ্লো প্রতিরোধে কোন ভালভ ব্যবহার করা হয়?","options":["গেট ভালভ","বল ভালভ","ফ্লোট ভালভ","গ্লোব ভালভ"],"answer":2,"explain":"ফ্লোট ভালভের বল পানির সাথে ভেসে ওঠে; পানি নির্দিষ্ট লেভেলে পৌঁছালে নিজে থেকেই প্রবাহ বন্ধ করে দেয়। তাই ট্যাংক বা সিস্টার্ন উপচে পড়ে না।"},{"id":"1-12","paper":1,"n":12,"q":"সাময়িকভাবে পানির লাইন বন্ধ রাখার জন্য কী ব্যবহার করা হয়?","options":["প্লাগ","সকেট","নিপল","এলবো"],"answer":0,"explain":"প্লাগ পাইপ বা ফিটিংসের খোলা মুখ সাময়িকভাবে বন্ধ রাখে; পরে খুলে লাইন বাড়ানো যায়। সকেট, নিপল, এলবো জোড়া দেওয়ার কাজে লাগে।"},{"id":"1-13","paper":1,"n":13,"q":"বড় লাইন থেকে ছোট লাইন নেওয়ার জন্য কী ব্যবহার করা হয়?","options":["রিডিউসিং সকেট","এলবো","বল ভালভ","ইউনিয়ন"],"answer":0,"explain":"রিডিউসিং সকেটের এক মুখ বড়, অন্য মুখ ছোট; তাই বড় ব্যাসের পাইপ থেকে ছোট ব্যাসের পাইপে সোজা সংযোগ দেওয়া যায়।"},{"id":"1-14","paper":1,"n":14,"q":"পানির প্রবাহ সহজে খোলা ও বন্ধ করার জন্য কী ব্যবহার করা হয়?","options":["গ্লোব ভালভ","গেট ভালভ","বল ভালভ","সেফটি ভালভ"],"answer":2,"explain":"বল ভালভের হাতল মাত্র চার ভাগের এক পাক (৯০°) ঘোরালেই পুরো খোলা বা পুরো বন্ধ হয়। তাই এটি সবচেয়ে সহজে ও দ্রুত চালানো যায়।"},{"id":"1-15","paper":1,"n":15,"q":"কোন পাইপে মরিচা পড়ে না?","options":["জিআই পাইপ","পিভিসি পাইপ","এম এস পাইপ","কাস্ট আয়রন পাইপ"],"answer":1,"explain":"পিভিসি প্লাস্টিকের তৈরি, এতে লোহা নেই; তাই মরিচা ধরে না। জিআই, এমএস ও কাস্ট আয়রন লোহার পাইপ, সময়ের সাথে মরিচা ধরতে পারে।"},{"id":"1-16","paper":1,"n":16,"q":"কোন ভাইসে পাইপ আটকাতে হয়?","options":["পাইপ ভাইস","টেবিল ভাইস","সফট ভাইস","মেশিন ভাইস"],"answer":0,"explain":"পাইপ ভাইসের চোয়াল গোল পাইপকে শক্ত করে ধরে রাখে, তাই কাটা বা প্যাঁচ কাটার সময় পাইপ ঘোরে না। অন্য ভাইস চ্যাপ্টা জিনিসের জন্য।"},{"id":"1-17","paper":1,"n":17,"q":"ট্র্যাপের কাজ কী?","options":["প্রতিবন্ধকতা সৃষ্টি করা","সহজে পানি নিষ্কাশন করা","পানি না রাখা","পানি ফেলে রাখা"],"answer":0,"explain":"ট্র্যাপের বাঁকে কিছু পানি জমে থাকে (ওয়াটার সিল)। এই পানি ড্রেন থেকে দুর্গন্ধ ও গ্যাস ঘরে আসার পথে বাধা বা প্রতিবন্ধকতা সৃষ্টি করে।"},{"id":"1-18","paper":1,"n":18,"q":"ফ্লোর থেকে বেসিনের স্ট্যান্ডার্ড উচ্চতা কত?","options":["৪৫ ইঞ্চি","৩৪ ইঞ্চি","৩৮ ইঞ্চি","৪২ ইঞ্চি"],"answer":1,"explain":"স্যারের নোট অনুযায়ী বেসিন ফ্লোর থেকে ৩৪ ইঞ্চি উপরে বসে। তাই ৩৪ ইঞ্চি সঠিক।"},{"id":"1-19","paper":1,"n":19,"q":"ওভারহেড ট্যাংকের অবস্থান কোথায় থাকে?","options":["মাটির নিচে","বাসার ভিতরে","ছাদের উপরে","বারান্দায়"],"answer":2,"explain":"ওভারহেড মানে মাথার উপরে। এই ট্যাংক ছাদের উপর থাকে, যাতে মাধ্যাকর্ষণে পানি নিচের সব তলায় চাপসহ পৌঁছায়।"},{"id":"1-20","paper":1,"n":20,"q":"নিচের কোনটি ফ্লোর কেটে বসানো হয়?","options":["লং প্যান","কমোড","ইউরিনাল","বেসিন"],"answer":0,"explain":"লং প্যান মেঝের সমতলে বসাতে হয়, তাই ফ্লোর কেটে গর্ত করে বসানো হয়। কমোড মেঝের উপর আর ইউরিনাল ও বেসিন দেয়ালে বসে।"},{"id":"1-21","paper":1,"n":21,"q":"পিছনের ওয়াল থেকে কমপক্ষে ট্র্যাপের সেন্টারের দূরত্ব কত?","options":["১১ ইঞ্চি","২০ ইঞ্চি","৩০ ইঞ্চি","৪৫ ইঞ্চি"],"answer":0,"explain":"কমো in":"সাধারণ হ্যান্ড ড্রিল হাতে ঘুরিয়ে চালাতে হয়, বিদ্যুৎ লাগে না; তাই এটি হ্যান্ড টুল। বাকিগুলো বিদ্যুতে চলে, তাই পাওয়ার টুলস।"},{"id":"1-48","paper":1,"n":48,"q":"ভিন্ন ব্যাসের পাইপ জোড়া দিতে কোনটি ব্যবহার করা হয়?","options":["সকেট (Socket)","এলবো (Elbow)","নিপল (Nipple)","রিডিউসার (Reducer)"],"answer":3,"explain":"রিডিউসারের দুই মুখ দুই মাপের, তাই এটি দিয়ে বড় ও ছোট ব্যাসের পাইপ জোড়া দেওয়া যায়। সাধারণ সকেট একই মাপের দুই পাইপ জোড়ে।"},{"id":"1-49","paper":1,"n":49,"q":"পাইপের তরলের গতি (Flow) নিয়ন্ত্রণ করে কোনটি?","options":["রানিং নিপল (Running nipple)","ভালভ (Valve)","এক্সটেনশন সকেট","রিডিউসার"],"answer":1,"explain":"ভালভ খুলে, বন্ধ করে বা আংশিক খুলে পাইপের পানির প্রবাহ নিয়ন্ত্রণ করা যায়। নিপল, সকেট ও রিডিউসার শুধু জোড়া দেওয়ার ফিটিংস।"},{"id":"1-50","paper":1,"n":50,"q":"অনুমোদিত কোনো পেশাদার সংস্থার সদস্যকে মেনে চলার জন্য যে নীতিগত স্ট্যান্ডার্ড বা নির্দেশিকা ব্যবহার করা হয় তাকে কী বলা হয়?","options":["Code of work","Code of practice","Code of profession","Code of occupation"],"answer":1,"explain":"Code of practice হলো পেশাদার সংস্থার তৈরি লিখিত নির্দেশিকা, যাতে সদস্যরা কীভাবে নিরাপদ ও সঠিকভাবে কাজ করবেন তার নিয়ম থাকে।"},{"id":"1-51","paper":1,"n":51,"q":"রিডিউসার কীভাবে স্থাপন করা হয়?","options":["বড় লাইন থেকে ছোট লাইন নেওয়ার জন্য","ছোট লাইন থেকে বড় লাইন নেওয়ার জন্য","ছোট লাইন থেকে ছোট লাইন নেওয়ার জন্য","বড় লাইন থেকে বড় লাইন নেওয়ার জন্য"],"answer":0,"explain":"পানি সরবরাহে প্রধান বড় লাইন থেকে শাখার ছোট লাইন নেওয়া হয়; রিডিউসার এই কাজে বড় মুখ প্রধান লাইনে আর ছোট মুখ শাখা লাইনে বসে।"},{"id":"1-52","paper":1,"n":52,"q":"কোনটি ফিজিক্যাল হ্যাজার্ড (Physical hazard)?","options":["ব্যাকটেরিয়া (Bacteria)","ভাইব্রেশন (Vibration)","গ্যাসেস (Gases)","ধুলা-বালি (Dusts)"],"answer":1,"explain":"শব্দ, তাপ, ভাইব্রেশন, আলো ইত্যাদি ফিজিক্যাল হ্যাজার্ড। ব্যাকটেরিয়া জৈবিক (বায়োলজিক্যাল), আর গ্যাস ও ধুলা রাসায়নিক হ্যাজার্ড।"},{"id":"1-53","paper":1,"n":53,"q":"OSH-এর পূর্ণ অর্থ কোনটি?","options":["Optional Safety habits","Occupational Safety habits","Occupational Safety and Health","Occupational health and Safety"],"answer":2,"explain":"OSH মানে Occupational Safety and Health, অর্থাৎ পেশাগত নিরাপত্তা ও স্বাস্থ্য। অক্ষরের ক্রম অনুযায়ী O-S-H মেলে শুধু এই বিকল্পে।"},{"id":"1-54","paper":1,"n":54,"q":"অবশ্যই পালনীয় নির্দেশনা বোঝাতে কোনটি নিয়ন্ত্রণকারী কর্তৃপক্ষের চিহ্ন?","options":["বিপজ্জনক চিহ্ন (Danger signs)","কার্যতার/বাধ্যতামূলক চিহ্ন (Mandatory signs)","সতর্কতা চিহ্ন (Warning signs)","জরুরি চিহ্ন (Emergency signs)"],"answer":1,"explain":"Mandatory sign (সাধারণত নীল গোল) বোঝায় কাজটি অবশ্যই করতে হবে, যেমন হেলমেট পরুন বা গ্লাভস পরুন। সতর্কতা চিহ্ন শুধু ঝুঁকি জানায়।"},{"id":"1-55","paper":1,"n":55,"q":"অ্যারো হেডসহ যে রেখা এক্সটেনশন লাইনে স্পর্শ করে দূরত্ব নির্দেশ করে তাকে কী বলে?","options":["ডাইমেনশন লাইন (Dimension line)","সেন্টার লাইন (Centre line)","এক্সটেনশন লাইন (Extension line)","ফ্যান্টম লাইন (Phantom line)"],"answer":0,"explain":"ডাইমেনশন লাইনের দুই মাথায় তীরচিহ্ন থাকে, তা এক্সটেনশন লাইন ছুঁয়ে মাপ বা দূরত্ব দেখায়। এক্সটেনশন লাইন শুধু বস্তুর কিনারা থেকে বাড়ানো রেখা।"},{"id":"1-56","paper":1,"n":56,"q":"জিআই পাইপের প্যাঁচ কাটার সময় সাধারণত যে দোষ/সমস্যার সৃষ্টি হয়?","options":["দাঁত ভাঙা (Broken the teeth)","চিড় ধরা (Crack)","অসম প্যাঁচ (Uneven threads)","ডাই ভাঙা (Broken down the die)"],"answer":0,"explain":"তেল ছাড়া, ভোঁতা ডাই দিয়ে বা ডাই ঠিকমতো না বসিয়ে প্যাঁচ কাটলে প্যাঁচের দাঁত ভেঙে/ছিঁড়ে যায় — এটিই সবচেয়ে সাধারণ দোষ। তাই প্যাঁচ কাটার সময় কাটিং অয়েল দিতে হয় ও ডাই ধার রাখতে হয়।"},{"id":"1-57","paper":1,"n":57,"q":"একটি নির্দিষ্ট কাজের জন্য কীভাবে পাইপ নির্বাচন করা হয়?","options":["ব্যক্তি সিদ্ধান্ত অনুযায়ী (According to your own decision)","বিবরণী অনুযায়ী (As per specification)","সরবরাহ অনুযায়ী (As per supply)","প্রাপ্যতা অনুযায়ী (According to availability)"],"answer":1,"explain":"কোন কাজে কোন ধরনের ও কোন মাপের পাইপ লাগবে তা স্পেসিফিকেশন বা বিবরণীতে লেখা থাকে। নিজের ইচ্ছা বা হাতের কাছে যা আছে তা দিয়ে নয়।"},{"id":"1-58","paper":1,"n":58,"q":"পানি ফিরে না আসার জন্য কোন ভাল ট্রিক হ্যান্ড ড্রিল মেশিন","হ্যাক স","ইলেকট্রিক গ্রাইন্ডিং মেশিন","পাওয়ার হ্যাকস"],"answer":1,"explain":"পাওয়ার টুলস বিদ্যুৎ বা মোটরে চলে। সাধারণ হ্যাক স হাতে চালাতে হয়, তাই এটি হ্যান্ড টুল, পাওয়ার টুল নয়।"},{"id":"7-3","paper":7,"n":3,"q":"ভিন্ন ব্যাসের পাইপ জোড়া দিতে কোনটি ব্যবহার করা হয়?","options":["সকেট","এলবো (Elbow)","নিপল (Nipple)","রিডিউসার (Reducer)"],"answer":3,"explain":"রিডিউসারের দুই মুখ দুই সাইজের, তাই বড় ও ছোট ব্যাসের পাইপ সরাসরি জোড়া দেওয়া যায়। সকেট ও নিপল একই সাইজের পাইপ জোড়ে।"},{"id":"7-4","paper":7,"n":4,"q":"পাইপের তরলের গতি (Flow) নিয়ন্ত্রণ করে কোনটি?","options":["রানিং নিপল","ভালভ (Valve)","এক্সটেনশন জয়েন্ট","রিডিউসার"],"answer":1,"explain":"ভালভ খুলে-বন্ধ করে বা আংশিক খুলে পাইপের তরলের প্রবাহ চালু, বন্ধ ও কম-বেশি করা যায়। বাকিগুলো শুধু জোড়া দেওয়ার ফিটিংস।"},{"id":"7-5","paper":7,"n":5,"q":"অনুমোদিত কোনো পেশাদার সংস্থার সদস্যকে মেনে চলার জন্য যে নীতিগত স্ট্যান্ডার্ড বা নির্দেশিকা ব্যবহার করা হয় তাকে কী বলা হয়?","options":["Code of work","Code of practice","Code of profession","Code of occupation"],"answer":1,"explain":"পেশাদার সংস্থা তার সদস্যদের কাজের মান ও আচরণের জন্য যে লিখিত নির্দেশিকা দেয় তাকে Code of practice বলে।"},{"id":"7-6","paper":7,"n":6,"q":"রিডিউসার কীভাবে স্থাপন করা হয়?","options":["বড় লাইন থেকে ছোট লাইন নেওয়ার জন্য","ছোট লাইন থেকে বড় লাইন নেওয়ার জন্য","ছোট লাইন থেকে ছোট লাইন নেওয়ার জন্য","বড় লাইন থেকে বড় লাইন নেওয়ার জন্য"],"answer":0,"explain":"রিডিউসারের কাজ পাইপের সাইজ কমানো। মূল বড় লাইন থেকে ছোট সাইজের শাখা লাইন নিতে রিডিউসার বসানো হয়।"},{"id":"7-7","paper":7,"n":7,"q":"কোনটি ফিজিক্যাল হ্যাজার্ড (physical hazard)?","options":["ব্যাকটেরিয়া","ভাইব্রেশন","গ্যাসেস","ধুলা-বালিযুক্ত জায়গা (Dusty place)"],"answer":1,"explain":"শব্দ, তাপ, কম্পন (ভাইব্রেশন) ইত্যাদি ফিজিক্যাল হ্যাজার্ড। ব্যাকটেরিয়া জৈব হ্যাজার্ড এবং গ্যাস ও ধুলা রাসায়নিক হ্যাজার্ড হিসেবে ধরা হয়।"},{"id":"7-8","paper":7,"n":8,"q":"OSH-এর পূর্ণ অর্থ কোনটি?","options":["Optional Safety habits","Occupational Safety habits","Occupational Safety and Health","Occupational Safe and health"],"answer":2,"explain":"OSH = Occupational Safety and Health, অর্থাৎ পেশাগত নিরাপত্তা ও স্বাস্থ্য। কর্মক্ষেত্রে দুর্ঘটনা ও অসুস্থতা প্রতিরোধই এর উদ্দেশ্য।"},{"id":"7-9","paper":7,"n":9,"q":"অবশ্যই পালনীয় নির্দেশনা বোঝাতে কোনটি নিয়ন্ত্রণকারী কর্তৃপক্ষের চিহ্ন?","options":["বিপদজনক চিহ্ন (Danger signs)","কার্যভার চিহ্ন (Mandatory signs)","সতর্কতা চিহ্ন (Warning signs)","জরুরি চিহ্ন (Emergency signs)"],"answer":1,"explain":"Mandatory sign (নীল গোল চিহ্ন) মানে কাজটি অবশ্যই করতে হবে, যেমন হেলমেট পরুন। বিপদ ও সতর্কতা চিহ্ন শুধু ঝুঁকি জানায়।"},{"id":"7-10","paper":7,"n":10,"q":"অ্যারো হেডসহ যে রেখা এক্সটেনশন লাইনে স্পর্শ করে দূরত্ব নির্দেশ করে তাকে বলে—","options":["ডাইমেনশন লাইন (Dimension line)","সেন্টার লাইন (Centre line)","এক্সটেনশন লাইন (Extension line)","ফ্যান্টম লাইন (Phantom line)"],"answer":0,"explain":"ড্রয়িংয়ে দুই প্রান্তে তীরচিহ্নসহ যে রেখা এক্সটেনশন লাইন ছুঁয়ে মাপ দেখায় তাকে ডাইমেনশন লাইন বলে, এর ওপর মাপ লেখা থাকে।"},{"id":"7-11","paper":7,"n":11,"q":"জি. আই পাইপের প্যাঁচ কাটার সময় সাধারণত কোন দোষ/সমস্যার সৃষ্টি হয়?","options":["দাঁত ভাঙা (Broken the teeth)","চিড় ধরা (Crack)","অসম প্যাঁচ (Uneven threads)","ডাই ভাঙা (Broken down the die)"],"answer":0,"explain":"তেল ছাড়া, ভোঁতা ডাই দিয়ে বা ডাই ঠিকমতো না বসিয়ে প্যাঁচ কাটলে প্যাঁচের দাঁত ভেঙে/ছিঁড়ে যায় — এটিই সবচেয়ে সাধারণ দোষ। তাই প্যাঁচ কাটার সময় কাটিং অয়েল দিতে হয় ও ডাই ধার রাখতে হয়।"},{"id":"7-11b","paper":7,"n":11,"q":"একটি নির্দিষ্ট কাজের জন্য কীভাবে পাইপ নির্বাচন করা হয়?","options":["ব্যক্তি সিদ্ধান্ত অনুযায়ী (According to your own decision)","বিবরণী অনুযায়ী (As per specification)","সরবরাহ অনুযায়ী (As per supply)","প্রাপ্যতা অনুযায়ী (According to availability)"],"answer":1,"explain":"কাজের নকশা ও স্পেসিফিকেশনে পাইপের ধরন, সাইজ ও মান নির্দিষ্ট থাকে। নিজের ইচ্ছা বা সহজলভ্যতা অনুযায়ী নিলে মান ও নিরাপত্তা নষ্ট হতে পারে।"},{"id":"7-12","paper":7,"n":12,"q":"১/২ ইঞ্চি সমান কত মি.মি.?","options":["১২ মি.মি.","১২.৭ মি.মি.","১.২৭ মি.মি.","১২.৫ মি.মি."],"answer":1,"explain":"১ ইঞ্চি = ২৫.৪ মি.মি.। তাই ১/২ ইঞ্চি = ২৫.৪ ÷ ২ = ১২.৭ মি.মি.।"},{"id":"7-13","paper":7,"n":13,"q":"৯০ ডিগ্রি কোণ পরিমাপের জন্য কোনটি ব্যবহার করা হয়?","options":["স্পিরিট লেভেলার","মেজারিং টেপ","স্টিল রুল","ট্রাই স্কয়ার"],"answer":3,"explain":"ট্রাই স্কয়ারের দুই বাহু পরস্পর ৯০ ডিগ্রিতে থাকে, তাই এটি দিয়ে সমকোণ পরীক্ষা ও মার্কিং করা হয়। স্পিরিট লেভেল দিয়ে সমতল দেখা হয়।"},{"id":"7-14","paper":7,"n":14,"q":"একই সাইজের তিনটি পাইপ জয়েন্ট করার জন্য কোনটি ব্যবহার করা হয়?","options":["সকেট","ইকুয়েল টি","ক্রস","রিডিউসিং টি"],"answer":1,"explain":"ইকুয়েল টি-এর তিনটি মুখই একই সাইজের, তাই একই সাইজের তিনটি পাইপ জোড়া যায়। ক্রসে চারটি মুখ, রিডিউসিং টি-তে সাইজ ভিন্ন।"},{"id":"7-15","paper":7,"n":15,"q":"ইউপিভিসি (UPVC) পাইপের ব্যবহারে সুবিধা কী?","options":["ভালো পরিবাহী (Good conductivity)","মরিচারোধী","তাপ কুপরিবাহী (Heat resistance)","স্টিল পাইপের তুলনায় উচ্চ চাপের তরল বহন ক্ষমতা বেশি"],"answer":1,"explain":"UPVC প্লাস্টিক হওয়ায় এতে মরিচা ধরে না, এটাই প্রধান সুবিধা। এটি স্টিলের চেয়ে বেশি চাপ সহ্য করে না এবং বিদ্যুৎ/তাপের ভালো পরিবাহীও নয়।"},{"id":"7-16","paper":7,"n":16,"q":"পাইপ রিমার দিয়ে কী পরিষ্কার করা হয়?","options":["পাইপের থ্রেড","পাইপের নিকেল","পাইপের ময়লা","পাইপের বারবারি (Burr)"],"answer":3,"explain":"পাইপ কাটার পর মুখের ভেতরে ধারালো খাঁজ বা বারবারি (burr) তৈরি হয়। রিমার ঘুরিয়ে এই burr পরিষ্কার করা হয়, যাতে পানির প্রবাহ বাধা না পায়।"},{"id":"7-17","paper":7,"n":17,"q":"কোন ফাইল দ্বারা পাইপের ভেতর পরিষ্কার করা হয়?","options":["হাফ রাউন্ড","ফ্ল্যাট","ট্রায়াঙ্গুলার","স্কয়ার"],"answer":0,"explain":"হাফ রাউন্ড ফাইলের এক পাশ গোলাকার, তাই পাইপের গোল ভেতরের দেয়াল ঘষে পরিষ্কার করা যায়। ফ্ল্যাট ফাইল সমতল জায়গার জন্য।"},{"id":"7-18","paper":7,"n":18,"q":"কোন পাইপ তাপ প্রয়োগে জোড়া দেওয়া সম্ভব?","options":["জি আই পাইপ","পি.ভি.সি পাইপ","সি. আই পাইপ","পি.ভি.সি থ্রেড পাইপ"],"answer":1,"explain":"পিভিসি পাইপ প্লাস্টিক, তাপ দিলে নরম হয়, তাই তাপ দিয়ে মুখ বড় করে জোড়া দেওয়া যায়। জিআই ও সিআই ধাতব পাইপ প্যাঁচ বা অন্য পদ্ধতিতে জোড়া হয়।"},{"id":"7-19","paper":7,"n":19,"q":"অধিক দৈর্ঘ্যের পাইপ পরিমাপের জন্য কী ব্যবহার করা হয়?","options":["ফাইল","পাইপ কাটার","মেজারিং টেপ","ফিতা"],"answer":3,"explain":"অনেক লম্বা দৈর্ঘ্য মাপতে লম্বা ফিতা (লং টেপ) ব্যবহার হয়; ছোট দৈর্ঘ্যের জন্য পকেট মেজারিং টেপ। ফাইল ও পাইপ কাটার মাপার যন্ত্র নয়।"},{"id":"7-20","paper":7,"n":20,"q":"লে-আউট করার জন্য কী ব্যবহার করা হয়?","options":["চক","কলম","লেভেলার","স্ক্রেপার"],"answer":0,"explain":"দেয়াল বা মেঝেতে পাইপ লাইনের রুট দাগানোর (লে-আউট) জন্য চক বা চক-লাইন ব্যবহার করা হয়; সহজে দাগ পড়ে ও পরে মুছে ফেলা যায়।"},{"id":"7-21","paper":7,"n":21,"q":"লিক টেস্ট কখন করা হয়?","options":["দেওয়ালে লাগানোর আগে","দেওয়ালে লাগানোর পর","দেওয়ালে লাগানোর সময়","কোনটিই নয়"],"answer":1,"explain":"পাইপ লাইন সম্পূর্ণ বসানোর (দেওয়ালে ফিট করার) পর কিন্তু প্লাস্টার বা ঢেকে দেওয়ার আগে প্রেসার দিয়ে লিক টেস্ট করা হয়, যাতে লিক পেলে সহজে মেরামত করা যায়।"},{"id":"7-22","paper":7,"n":22,"q":"লুকিং গ্লাস কত উচ্চতায় লাগানো হয়?","options":["৪২ ইঞ্চি","৪৮ ইঞ্চি","৪৪ ইঞ্চি","৩৮ ইঞ্চি"],"answer":1,"explain":"স্যারের নোট অনুযায়ী লুকিং গ্লাস (আয়না) ফ্লোর থেকে ৪৮ ইঞ্চি উপরে বসে, যাতে দাঁড়িয়ে মুখ দেখা যায়।"},{"id":"7-23","paper":7,"n":23,"q":"কোন ভালভটি খুলতে সহজ হয়?","options":["চেক ভালভ","বল ভালভ","ফ্লোট ভালভ","গেট ভালভ"],"answer":1,"explain":"বল ভালভ মাত্র এক-চতুর্থাংশ (৯০°) ঘোরালেই পুরো খোলা বা বন্ধ হয়, তাই এটি সবচেয়ে সহজে খোলা যায়। গেট ভালভ অনেকবার ঘোরাতে হয়।"},{"id":"7-24","paper":7,"n":24,"q":"পাইপের ভিতরে থ্রেড কাটার জন্য কোনটি উপযোগী?","options":["ডাইস্টক উইথ ডাই","ডাই","ট্যাপ হ্যান্ডেল উইথ ট্যাপ","ট্যাপ"],"answer":2,"explain":"ভেতরের প্যাঁচ (ইন্টারনাল থ্রেড) ট্যাপ দিয়ে কাটা হয়, আর ট্যাপ ঘোরাতে ট্যাপ হ্যান্ডেল লাগে। ডাই ও ডাইস্টক বাইরের প্যাঁচের জন্য।"},{"id":"7-25","paper":7,"n":25,"q":"OHS এর পূর্ণ নাম কী?","options":["Optional Habits and Safety","Occupational Safety and Health","Occupational Health and Safety","Occupational Safe and Health"],"answer":2,"explain":"OHS = Occupational Health and Safety (পেশাগ  দিয়ে কাজ করলে মান ও নিরাপত্তা নষ্ট হয়।"},{"id":"9-2","paper":9,"n":2,"q":"শ্রমিকদের নিরাপত্তাজনিত অনুশীলন অবহিত করতে যে ছবি ব্যবহার করা হয়ে থাকে তাকে কী বলে?","options":["সতর্কতা","নিষেধসমূহ","সাবধানতা","নিরাপত্তা চিহ্নসমূহ"],"answer":3,"explain":"কর্মক্ষেত্রে বিপদ, নিষেধ, বাধ্যতামূলক কাজ ইত্যাদি বোঝাতে যে ছবি বা প্রতীক ব্যবহার করা হয় তাকে নিরাপত্তা চিহ্ন (Safety signs) বলে। সতর্কতা বা নিষেধ এগুলোর এক একটি ধরন মাত্র।"},{"id":"9-3","paper":9,"n":3,"q":"পাইপের জয়েন্ট করতে নিচের কোন টুলস ব্যবহার করা হয়?","options":["পাইপ কাটার","পাইপ রেঞ্চ","হ্যামার","অ্যাডজাস্টেবল রেঞ্চ"],"answer":1,"explain":"জিআই পাইপ ও ফিটিংস প্যাঁচ দিয়ে টাইট করে জয়েন্ট করতে পাইপ রেঞ্চ ব্যবহার করা হয়, কারণ এর দাঁতওয়ালা চোয়াল গোল পাইপ শক্ত করে ধরে। অ্যাডজাস্টেবল রেঞ্চ নাট-বোল্টের জন্য, পাইপ কাটার কাটার জন্য।"},{"id":"9-4","paper":9,"n":4,"q":"অনুমোদিত কোনো পেশাদার সংস্থার সদস্যকে মেনে চলার জন্য যে নীতিগত স্ট্যান্ডার্ড বা নির্দেশিকা ব্যবহার করা হয় তাকে কী বলা হয়?","options":["Code of work","Code of practice","Code of profession","Code of occupation"],"answer":1,"explain":"কোনো পেশার সদস্যদের কাজের সঠিক পদ্ধতি ও নৈতিক মান মেনে চলার লিখিত নির্দেশিকাকে Code of practice বলে। এটি পেশাদার সংস্থা অনুমোদন করে এবং কাজের মান ও নিরাপত্তা নিশ্চিত করে।"},{"id":"9-5","paper":9,"n":5,"q":"লেভেলিং করতে কোন টুলস ব্যবহার করা হয়?","options":["স্টিল রুল","স্পিরিট লেভেল","মেজারিং টেপ","টেফলন টেপ"],"answer":1,"explain":"স্পিরিট লেভেলের ভেতরের তরলের বুদবুদ মাঝখানে থাকলে তল সমান (লেভেল) বোঝায়। তাই পাইপ বা ফিক্সচার সমতল/খাড়া করে বসাতে স্পিরিট লেভেল ব্যবহার করা হয়।"},{"id":"9-6","paper":9,"n":6,"q":"লো-ডাউন সিস্টার্নের পানি কোন ভাল্ভ দ্বারা নিয়ন্ত্রণ করা হয়?","options":["ফ্লোট ভাল্ভ","চেক ভাল্ভ","ইউনিয়ন","নিপল"],"answer":0,"explain":"সিস্টার্নে পানি ভরলে ফ্লোট (বল) উপরে উঠে ফ্লোট ভাল্ভ বন্ধ করে দেয়, পানি কমলে আবার খুলে যায়। এভাবে ফ্লোট ভাল্ভ সিস্টার্নের পানির লেভেল স্বয়ংক্রিয়ভাবে নিয়ন্ত্রণ করে।"},{"id":"9-7","paper":9,"n":7,"q":"পাইপের সাইজ বলতে কী বোঝায়?","options":["ভিতরের ডায়ামিটার","বাহিরের ডায়ামিটার","দৈর্ঘ্য","আকার"],"answer":0,"explain":"প্লাম্বিংয়ে পাইপের সাইজ সাধারণত ভিতরের ব্যাস (নমিনাল বোর) দিয়ে বোঝানো হয়, কারণ পানির প্রবাহ ভিতরের ব্যাসের উপর নির্ভর করে। যেমন ½ ইঞ্চি পাইপ মানে প্রায় ½ ইঞ্চি ভিতরের ব্যাস।"},{"id":"9-8","paper":9,"n":8,"q":"পানির স্পিড বাড়ানোর জন্য কোন ফিটিংস ব্যবহার করা হয়?","options":["রিডিউসার","এলবো","ইউনিয়ন","নিপল"],"answer":0,"explain":"রিডিউসার বড় পাইপকে ছোট পাইপে রূপান্তর করে। একই পরিমাণ পানি সরু পথে যেতে হলে তার গতি বেড়ে যায়, তাই রিডিউসার পানির গতি বাড়ায়।"},{"id":"9-9","paper":9,"n":9,"q":"বিভিন্ন সাইজের পাইপ সংযোগ দেওয়ার জন্য কোন ফিটিংস ব্যবহার করা হয়?","options":["সকেট","এলবো","রিডিউসার","নিপল"],"answer":2,"explain":"রিডিউসারের দুই মুখ দুই সাইজের, তাই ভিন্ন ব্যাসের দুটি পাইপ সোজাসুজি জোড়া দিতে রিডিউসার ব্যবহার হয়। সকেট একই সাইজের পাইপ জোড়ে, এলবো দিক পরিবর্তন করে।"},{"id":"9-10","paper":9,"n":10,"q":"জিআই পাইপের প্যাঁচ কাটার সময় কোন দোষ/সমস্যার সৃষ্টি হয়?","options":["Broken the teeth","Crack","Uneven threads","Broken down the die"],"answer":0,"explain":"তেল ছাড়া, ভোঁতা ডাই দিয়ে বা ডাই ঠিকমতো না বসিয়ে প্যাঁচ কাটলে প্যাঁচের দাঁত ভেঙে/ছিঁড়ে যায় — এটিই সবচেয়ে সাধারণ দোষ। তাই প্যাঁচ কাটার সময় কাটিং অয়েল দিতে হয় ও ডাই ধার রাখতে হয়।"},{"id":"9-11","paper":9,"n":11,"q":"uPVC পাইপের ব্যবহার কী কারণে ভালো?","options":["Good conductivity","Heavy thickness","Heat resistance","মরিচারোধী"],"answer":3,"explain":"uPVC প্লাস্টিকের তৈরি, তাই এতে মরিচা ধরে না, পানিতে ক্ষয় হয় না এবং ওজনে হালকা। এটি তাপ সহনশীল নয় এবং বিদ্যুৎ পরিবাহীও নয়, তাই মরিচারোধী হওয়াই এর মূল সুবিধা।"},{"id":"9-12","paper":9,"n":12,"q":"Construction Sector-এ নিচের কোনটি হ্যাজার্ড?","options":["বৈদ্যুতিক তার","ইটের টুকরা","রডের টুকরা","সবগুলো"],"answer":3,"explain":"খোলা বৈদ্যুতিক তারে শক লাগতে পারে, ইটের টুকরায় হোঁচট খাওয়া যায়, রডের টুকরায় কেটে বা বিঁধে যেতে পারে। তাই নির্মাণ এলাকায় এ সবগুলোই হ্যাজার্ড।"},{"id":"9-13","paper":9,"n":13,"q":"কোনটি ফিক্সচার?","options":["ইউরিনাল","ক্যাপ","ক্রস","পাইপ ভাইস"],"answer":0,"explain":"ফিক্সচার হলো পানি ব্যবহার ও ময়লা পানি নিষ্কাশনের স্থায়ী স্যানিটারি সামগ্রী, যেমন ইউরিনাল, বেসিন, কমোড। ক্যাপ ও ক্রস ফিটিংস, আর পাইপ ভাইস একটি টুল।"},{"id":"9-14","paper":9,"n":14,"q":"যে রেগুলেটরি চিহ্ন বোঝায় যে কোনো নির্দেশ অবশ্যই পালন করতে হবে তাকে কী বলে?","options":["Danger signs","Mandatory signs","Warning signs","Emergency signs"],"answer":1,"explain":"বাধ্যতামূলক চিহ্ন (Mandatory sign) সাধারণত নীল গোল চিহ্ন, যেমন 'হেলমেট পরুন'। এটি এমন নির্দেশ দেয় যা অবশ্যই পালন করতে হবে।"},{"id":"9-15","paper":9,"n":15,"q":"পাইপের জয়েন্টের লিক সারাতে কী ব্যবহার হয়?","options":["গ্যাসকেট","সিল","আইকা","টেফলন টেপ"],"answer":3,"explain":"প্যাঁচওয়ালা জয়েন্টে লিক বন্ধ করতে প্যাঁচের উপর টেফলন টেপ পেঁচিয়ে আবার টাইট করা হয়। টেপ প্যাঁচের ফাঁক ভরাট করে পানি চুইয়ে পড়া বন্ধ করে।"},{"id":"9-16","paper":9,"n":16,"q":"কোনটি PPE নয়?","options":["হাত ঘড়ি","সেফটি সু","সেফটি গগলস","হেলমেট"],"answer":0,"explain":"PPE হলো শরীরকে আঘাত থেকে রক্ষার সরঞ্জাম, যেমন সেফটি সু, গগলস, হেলমেট। হাত ঘড়ি কোনো সুরক্ষা দেয় না, বরং মেশিনে আটকে দুর্ঘটনা ঘটাতে পারে।"},{"id":"9-17","paper":9,"n":17,"q":"রান্নাঘরে বাসন-কোসন মাজার জন্য কী ব্যবহার করা হয়?","options":["বেসিন","সিংক","কমোড","প্যান"],"answer":1,"explain":"রান্নাঘরে থালা-বাসন ধোয়ার জন্য গভীর ও বড় সিংক (কিচেন সিংক) ব্যবহার করা হয়। বেসিন হাত-মুখ ধোয়ার জন্য, কমোড ও প্যান টয়লেটের জন্য।"},{"id":"9-18","paper":9,"n":18,"q":"কোনটি আই প্রোটেকটিভ PPE?","options":["হ্যান্ড গ্লাভস","হেলমেট","সেফটি গগলস","পাইপ ভাইস"],"answer":2,"explain":"সেফটি গগলস চোখকে ধুলা, ধাতুর কুচি ও রাসায়নিক ছিটা থেকে রক্ষা করে, তাই এটি চোখের সুরক্ষার PPE। গ্লাভস হাতের, হেলমেট মাথার সুরক্ষা দেয়।"},{"id":"9-19","paper":9,"n":19,"q":"কোনটি হেড প্রোটেকটিভ PPE?","options":["হ্যান্ড গ্লাভস","হেলমেট","এপ্রোন","ফেস মাস্ক"],"answer":1,"explain":"হেলমেট উপর থেকে পড়া বস্তু বা ধাক্কা থেকে মাথা রক্ষা করে, তাই এটি মাথার সুরক্ষা সরঞ্জাম। এপ্রোন শরীরের, মাস্ক নাক-মুখের সুরক্ষা দেয়।"},{"id":"9-20","paper":9,"n":20,"q":"নিচের কোনটি মেজারিং টুলস?","options":["মেজারিং টেপ","ট্রাই-স্কয়ার","স্কেল","সবগুলো"],"answer":3,"explain":"মেজারিং টেপ ও স্কেল দিয়ে দৈর্ঘ্য মাপা হয়, ট্রাই-স্কয়ার দিয়ে ৯০ ডিগ্রি কোণ মাপা ও পরীক্ষা করা হয়। তাই সবগুলোই পরিমাপের টুলস।"},{"id":"9-21","paper":9,"n":21,"q":"কাটিং অয়েল কী কাজে ব্যবহার করা হয়?","options":["পিভিসি পাইপ কাটার জন্য","ইউপিভিসি পাইপ কাটার জন্য","জিআই পাইপে প্যাঁচ কাটার জন্য","পাইপে ফিটিংস ব্যবহারের জন্য"],"answer":2,"explain":"জিআই পাইপে ডাই দিয়ে প্যাঁচ কাটার সময় ঘর্ষণে তাপ তৈরি হয়। কাটিং অয়েল তাপ কমায়, ডাই পিচ্ছিল রাখে এবং প্যাঁচ মসৃণ ও নিখুঁত করে।"},{"id":"9-22","paper":9,"n":22,"q":"uPVC-এর পূর্ণরূপ কী?","options":["Uniform poly vinyl chloride","Unplasticized poly vinyl chloride","Under poly virus chloride","Unpoly noising chloride"],"answer":1,"explain":"uPVC মানে Unplasticized Poly Vinyl Chloride। এতে নরম করার প্লাস্টিসাইজার মেশানো হয় না, তাই এটি শক্ত ও মজবুত, পানির লাইনে ব্যবহার উপযোগী।"},{"id":"9-23","paper":9,"n":23,"q":"পিভিসি পাইপের জয়েন্টের জন্য কী ব্যবহৃত হয়?","options":["আইকা","সলভেন্ট সিমেন্ট","থ্রেড টেপ","পিভিসি টেপ"],"answer":1,"explain":"সলভেন্ট সিমেন্ট পাইপ ও ফিটিংসের উপরিতল সামান্য গলিয়ে দুটিকে রাসায়নিকভাবে এক করে দেয়, ফলে মজবুত ও লিকমুক্ত জয়েন্ট হয়।"},{"id":"9-24","paper":9,"n":24,"q":"অ্যারো হেডসহ যে রেখা এক্সটেনশন লাইনকে স্পর্শ করে দূরত্ব নির্দেশ করে তাকে কী বলে?","options":["ডাইমেনশন লাইন","সেন্টার লাইন","এক্সটেনশন লাইন","ফ্যান্টম লাইন"],"answer":0,"explain":"ড্রয়িংয়ে দুই প্রান্তে তীরচিহ্নসহ যে সরু রেখা দুটি এক্সটেনশন লাইনের মাঝে মাপ দেখায় তাকে ডাইমেনশন লাইন বলে; এর উপর মাপের সংখ্যা লেখা হয়।"},{"id":"9-25","paper":9,"n":25,"q":"কাজের জায়গা পরিষ্কার করার জন্য নিচের কোনটি ব্যবহার করা হয়?","options":["প্লাস্টিক ব্রাশ","টুথ ব্রাশ","পেইন্টিং ব্রাশ","ঝাড়ু"],"answer":3,"explain":"কাজ শেষে মেঝের ধুলা, কাটা পাইপের টুকরা ও আবর্জনা ঝাড়ু দিয়ে পরিষ্কার করা হয়। অন্য ব্রাশগুলো ছোট কাজের জন্য, পুরো কর্মস্থল পরিষ্কারের জন্য নয়।"},{"id":"9-26","paper":9,"n":26,"q":"লিকপ্রুফ করার জন্য কোনটি ব্যবহার করা হয়?","options":["টেফলন টেপ","মেজারিং টেপ","স্টিল টেপ","বিব টেপ"],"answer":0,"explain":"প্যাঁচওয়ালা জয়েন্টে টেফলন টেপ পেঁচালে প্যাঁচের ফাঁক বন্ধ হয় এবং জয়েন্ট লিকপ্রুফ হয়। মেজারিং ও স্টিল টেপ মাপার জন্য।"},{"id":"9-27","paper":9,"n":27,"q":"ওভারফ্লো প্রতিরোধে কোন ভাল্ভ ব্যবহার করা হয়?","options":["গেট ভাল্ভ","বল ভাল্ভ","ফ্লোট ভাল্ভ","গ্লোব ভাল্ভ"],"answer":2,"explain":"ট্যাংক বা সিস্টার্ন পানিতে ভরে গেলে ফ্লোট উপরে উঠে ফ্লোট ভাল্ভ বন্ধ করে দেয়, ফলে পানি উপচে পড়ে না। অন্য ভাল্ভগুলো হাতে খুলতে-বন্ধ করতে হয়।"},{"id":"9-28","paper":9,"n":28,"q":"সাময়িকভাবে পানির লাইনকে বন্ধ রাখার জন্য কী ব্যবহার করা হয়?","options":["প্লাগ","সকেট","নিপল","এলবো"],"answer":0,"explain":"প্লাগ ফিটিংসের মুখে প্যাঁচ দিয়ে লাগিয়ে লাইন সাময়িক বন্ধ রাখা হয়, পরে খুলে আবার সংযোগ দেওয়া যায়। সকেট, নিপল, এলবো জোড়া দেওয়ার ফিটিংস।"},{"id":"9-29","paper":9,"n":29,"q":"কোন ভাইসে পাইপ আটকাতে হয়?","options":["পাইপ ভাইস","টেবিল ভাইস","সফট ভাইস","মেশিন ভাইস"],"answer":0,"explain":"পাইপ ভাইসের চোয়াল V আকৃতির ও দাঁতওয়ালা, তাই গোল পাইপ ঘুরে না গিয়ে শক্তভাবে আটকে থাকে। কাটা ও প্যাঁচ কাটার সময় পাইপ ভাইস ব্যবহার করা হয়।"},{"id":"9-30","paper":9,"n":30,"q":"ওভারহেড ট্যাংকের অবস্থান কোথায় থাকে?","options":["মাটির নিচে","বাসার ভিতরে","ছাদের উপরে","বারান্দায়"],"answer":2,"explain":"ওভারহেড ট্যাংক ছাদের উপরে বসানো হয় যাতে উচ্চতার কারণে মাধ্যাকর্ষণ চাপে পানি সব ফ্লোরের ট্যাপে পৌঁছায়। মাটির নিচেরটি আন্ডারগ্রাউন্ড রিজার্ভার।"},{"id":"9-31","paper":9,"n":31,"q":"পরিমাপ প্রধানত কত প্রকার?","options":["২ প্রকার","৩ প্রকার","৪ প্রকার","৫ প্রকার"],"answer":0,"explain":"পরিমাপ প্রধানত দুই প্রকার: রৈখিক পরিমাপ (দৈর্ঘ্য, প্রস্থ, উচ্চতা) এবং কৌণিক পরিমাপ (কোণ)। এ দুটির উপরই প্লাম্বিংয়ের সব মাপজোখ নির্ভর করে।"},{"id":"9-32","paper":9,"n":32,"q":"টুলস কত প্রকার?","options":["২ প্রকার","৪ প্রকার","৩ প্রকার","৫ প্রকার"],"answer":0,"explain":"টুলস প্রধানত দুই প্রকার: হ্যান্ড টুলস (হাতে চালানো, যেমন রেঞ্চ, হ্যাকস) এবং পাওয়ার টুলস (বিদ্যুৎ/মোটরে চলা, যেমন ড্রিল মেশিন)।"},{"id":"9-33","paper":9,"n":33,"q":"পাইপ প্রধানত কত প্রকার?","options":["২ প্রকার","৩ প্রকার","৪ প্রকার","৫ প্রকার"],"answer":0,"explain":"পাইপ প্রধানত দুই প্রকার: ধাতব পাইপ (জিআই, সিআই, কপার) এবং অধাতব পাইপ (পিভিসি, uPVC, পিপিআর)। এরপর উপাদান অনুযায়ী আরও ভাগ করা হয়।"},{"id":"9-34","paper":9,"n":34,"q":"অধিক দৈর্ঘ্যের পাইপ পরিমাপের জন্য কী ব্যবহার করা হয়?","options":["ফাইল","পাইপ কাটার","মেজারিং টেপ","ফিতা"],"answer":3,"explain":"অনেক লম্বা দৈর্ঘ্য মাপতে লম্বা ফিতা (৩০–৫০ মিটারের টেপ) ব্যবহার করা হয়। সাধারণ মেজারিং টেপ ছোট (৩–৫ মিটার), তাই লম্বা মাপে ফিতা সুবিধাজনক।"},{"id":"9-35","paper":9,"n":35,"q":"লে-আউট করার জন্য কী ব্যবহার করা হয়?","options":["চক","কলম","লেভেলার","কম্পাস"],"answer":0,"explain":"দেয়াল বা মেঝেতে পাইপ লাইনের রুট চিহ্নিত করতে চক (বা চক-লাইন) ব্যবহার করা হয়। চকের দাগ সহজে দেখা যায় এবং কাজ শেষে মুছে ফেলা যায়।"},{"id":"9-36","paper":9,"n":36,"q":"লিক টেস্ট কখন করা হয়?","options":["দেওয়ালে লাগানোর আগে","দেওয়ালে লাগানোর পর","দেওয়ালে লাগানোর সময়","কোনোটিই নয়"],"answer":1,"explain":"পাইপ লাইন দেয়ালে বসানো শেষ হলে, প্লাস্টার বা ঢেকে দেওয়ার আগে প্রেসার দিয়ে লিক টেস্ট করা হয়। লাইন বসানো না হলে পুরো সিস্টেম পরীক্ষা করা যায় না।"},{"id":"9-37","paper":9,"n":37,"q":"কোন ভাল্ভটি খুলতে সহজ হয়?","options":["চেক ভাল্ভ","বল ভাল্ভ","ফ্লোট ভাল্ভ","গেট ভাল্ভ"],"answer":1,"explain":"বল ভাল্ভ মাত্র ৯০ ডিগ্রি (কোয়ার্টার টার্ন) ঘোরালেই পুরো খোলে বা বন্ধ হয়। গেট ভাল্ভ অনেকবার ঘোরাতে হয়, আর চেক ও ফ্লোট ভাল্ভ হাতে খোলা হয় না।"},{"id":"9-38","paper":9,"n":38,"q":"কোনটি পাওয়ার টুলস (Power tools) নয়?","options":["ইলেকট্রিক হ্যান্ড ড্রিল মেশিন","হ্যান্ড ড্রিল মেশিন","ইলেকট্রিক গ্রাইন্ডিং মেশিন","পাওয়ার হ্যাকস"],"answer":1,"explain":"হ্যান্ড ড্রিল মেশিন হাতে ঘুরিয়ে চালাতে হয়, তাই এটি হ্যান্ড টুল। অন্যগুলো বিদ্যুৎ বা মোটরে চলে, তাই পাওয়ার টুলস।"},{"id":"9-39","paper":9,"n":39,"q":"১০ মিটার সমান কত ইঞ্চি?","options":["৩৯৩.৯ ইঞ্চি","৩৭৩.৯ ইঞ্চি","৩৯৩.৭ ইঞ্চি","৩৫৭.৯ ইঞ্চি"],"answer":2,"explain":"১ মিটার = ৩৯.৩৭ ইঞ্চি। তাই ১০ মিটার = ১০ × ৩৯.৩৭ = ৩৯৩.৭ ইঞ্চি।"},{"id":"9-40","paper":9,"n":40,"q":"কোনটি পাওয়ার টুলস নয়?","options":["গ্রাইন্ডিং মেশিন","ইলেকট্রিক হ্যান্ড ড্রিল মেশিন","হাইড্রোলিক বেন্ডিং মেশিন","ওয়েল্ডিং মেশিন"],"answer":2,"explain":"হাইড্রোলিক পাইপ বেন্ডিং মেশিন সাধারণত হাতলে পাম্প করে চালানো হয়, বিদ্যুৎ লাগে না। গ্রাইন্ডিং, ড্রিল ও ওয়েল্ডিং মেশিন বিদ্যুতে চলে, তাই সেগুলো পাওয়ার টুলস।"},{"id":"9-41","paper":9,"n":41,"q":"২০ ফুট লম্বা একটি জিআই পাইপকে ৮ জনকে সমানভাবে ভাগ করলে প্রত্যেকে কত ফুট পাইপ পাবে?","options":["৪ ফুট","৩ ফুট","২.৪ ফুট","২.৫ ফুট"],"answer":3,"explain":"মোট দৈর্ঘ্যকে জনসংখ্যা দিয়ে ভাগ করতে হবে: ২০ ÷ ৮ = ২.৫ ফুট। তাই প্রত্যেকে ২.৫ ফুট পাইপ পাবে।"},{"id":"9-42","paper":9,"n":42,"q":"সাইফন সিস্টার্নের পানি কোন ভাল্ভের দ্বারা নিয়ন্ত্রণ করা হয়?","options":["চেক ভাল্ভ","বল ভাল্ভ","ফ্লোট ভাল্ভ","গেট ভাল্ভ"],"answer":2,"explain":"সিস্টার্নে পানি ভরার সাথে ফ্লোট উপরে উঠে ফ্লোট ভাল্ভ বন্ধ করে, ফ্লাশের পর পানি কমলে খুলে আবার ভরে। তাই সিস্টার্নের পানি ফ্লোট ভাল্ভ নিয়ন্ত্রণ করে।"},{"id":"9-43","paper":9,"n":43,"q":"একই সাইজের পাইপ সংযোগ দেওয়ার জন্য কোন ফিটিংস ব্যবহার করা হয়?","options":["সকেট","এলবো","নিপল","রিডিউসার"],"answer":0,"explain":"সকেটের দুই মুখে একই সাইজের ভেতরের প্যাঁচ থাকে, তাই একই ব্যাসের দুটি পাইপ সোজাসুজি জোড়া দিতে সকেট ব্যবহার হয়। রিডিউসার ভিন্ন সাইজের জন্য।"},{"id":"9-44","paper":9,"n":44,"q":"কোন অবস্থায় Assessment বন্ধ হতে পারে?","options":["ক্যান্ডিডেট কম হলে","ক্যান্ডিডেট বেশি হলে","ভূমিকম্প হলে","ক্যান্ডিডেট ভয় পেলে"],"answer":2,"explain":"ভূমিকম্প, আগুন বা এমন জরুরি অবস্থায় সবার নিরাপত্তার জন্য অ্যাসেসমেন্ট সাথে সাথে বন্ধ করতে হয়। প্রার্থী কম-বেশি হওয়া বা ভয় পাওয়া বন্ধের কারণ নয়।"},{"id":"9-45","paper":9,"n":45,"q":"কোনটি বায়োলজিক্যাল হ্যাজার্ড (Biological hazard)?","options":["ব্যাকটেরিয়া (Bacteria)","কম্পন (Vibration)","গ্যাস (Gases)","ধুলা-বালি (Dusts)"],"answer":0,"explain":"বায়োলজিক্যাল হ্যাজার্ড হলো জীবন্ত জীবাণু থেকে ঝুঁকি, যেমন ব্যাকটেরিয়া, ভাইরাস। স্যুয়ারেজ লাইনে কাজে এটি বেশি থাকে। কম্পন ফিজিক্যাল, গ্যাস ও ধুলা কেমিক্যাল হ্যাজার্ড।"},{"id":"9-46","paper":9,"n":46,"q":"ইশারা নির্দেশ প্রণালীর মধ্যে কোনটি জরুরি (অবশ্য পালনীয়) নির্দেশনা?","options":["বিপদজনক ইশারা","বাধ্যতামূলক (কার্যকর) ইশারা","যুদ্ধ ইশারা","জরুরি অবস্থা ইশারা"],"answer":1,"explain":"যে ইশারা বা চিহ্ন দেখে নির্দেশটি অবশ্যই পালন করতে হয় তাকে বাধ্যতামূলক ইশারা বলে, যেমন 'হেলমেট পরুন'। বিপদের ইশারা শুধু সতর্ক করে।"},{"id":"9-47","paper":9,"n":47,"q":"কোনটি কর্মক্ষেত্রে পিচ্ছিল জাতীয় পদার্থ?","options":["লোহার টুকরা","কাঠের টুকরা","তেল (অয়েল)","কোনোটিই নয়"],"answer":2,"explain":"মেঝেতে তেল বা গ্রিজ পড়লে মেঝে পিচ্ছিল হয়ে পা পিছলে পড়ার ঝুঁকি তৈরি হয়। লোহা ও কাঠের টুকরা হোঁচটের ঝুঁকি, পিচ্ছিল নয়।"},{"id":"9-48","paper":9,"n":48,"q":"একটি ইউনিয়নের কয়টি পার্ট থাকে?","options":["দুইটি","তিনটি","চারটি","একটি"],"answer":1,"explain":"ইউনিয়নের তিনটি অংশ: দুটি প্রান্ত (মেল ও ফিমেল পার্ট) যা দুই পাইপে লাগে এবং মাঝের একটি নাট যা দুটিকে টাইট করে। নাট খুললে পাইপ সহজে আলাদা করা যায়।"},{"id":"9-49","paper":9,"n":49,"q":"½ ইঞ্চি ও ¾ ইঞ্চি একটি পাইপে ½ ইঞ্চির মধ্যে কয়টি প্যাঁচ থাকে?","options":["৬টি","৭টি","১৩টি","১৪টি"],"answer":1,"explain":"BSP স্ট্যান্ডার্ডে ½ ও ¾ ইঞ্চি পাইপে প্রতি ইঞ্চিতে ১৪টি প্যাঁচ (14 TPI) থাকে। তাই ½ ইঞ্চি দৈর্ঘ্যে থাকে ১৪ ÷ ২ = ৭টি প্যাঁচ।"},{"id":"9-50","paper":9,"n":50,"q":"কোন ফিটিংস থেকে সহজে পাইপ আলাদা করা যায়?","options":["সকেট","ইউনিয়ন","টি","এলবো"],"answer":1,"explain":"ইউনিয়নের মাঝের নাট খুললেই পাইপ ঘোরানো ছাড়াই দুই অংশ আলাদা হয়ে যায়। তাই মেরামত বা ভাল্ভ বদলানোর জায়গায় ইউনিয়ন দেওয়া হয়।"},{"id":"9-51","paper":9,"n":51,"q":"কোনটি PPE?","options":["মাস্ক","হাত ঘড়ি","বেঞ্চ প্রোটেক্টর","ক্যালিপার্স"],"answer":0,"explain":"মাস্ক নাক-মুখকে ধুলা ও ক্ষতিকর গ্যাস থেকে রক্ষা করে, তাই এটি ব্যক্তিগত সুরক্ষা সরঞ্জাম (PPE)। হাত ঘড়ি সুরক্ষা দেয় না, ক্যালিপার্স মাপার যন্ত্র।"},{"id":"9-52","paper":9,"n":52,"q":"জিআই পাইপের সাইজ কোনটি দ্বারা নির্ধারণ করা হয়?","options":["অভ্যন্তরীণ ব্যাস (Internal diameter)","বাহিরের ব্যাস (External diameter)","দৈর্ঘ্য","প্রস্থ"],"answer":0,"explain":"জিআই পাইপের নমিনাল সাইজ ভিতরের ব্যাস দিয়ে বলা হয়, কারণ পানির প্রবাহ ভিতরের পথের উপর নির্ভর করে। যেমন ½ ইঞ্চি জিআই পাইপের বোর প্রায় ½ ইঞ্চি।"},{"id":"9-53","paper":9,"n":53,"q":"কোনটি পাওয়ার টুলস (Power tools)?","options":["ইলেকট্রিক হ্যান্ড ড্রিল মেশিন","হ্যান্ড ড্রিল মেশিন","ক্ল-হ্যামার","কোল্ড চিজেল"],"answer":0,"explain":"ইলেকট্রিক হ্যান্ড ড্রিল মেশিন বিদ্যুতে চলে, তাই এটি পাওয়ার টুল। হ্যান্ড ড্রিল, ক্ল-হ্যামার ও কোল্ড চিজেল হাতের শক্তিতে চলে।"},{"id":"9-54","paper":9,"n":54,"q":"ভিন্ন ব্যাসের পাইপ জোড়া দিতে কোনটি ব্যবহার করা হয়?","options":["সকেট","এলবো (Elbow)","নিপল (Nipple)","রিডিউসার (Reducer)"],"answer":3,"explain":"রিডিউসারের এক মুখ বড়, অন্য মুখ ছোট, তাই ভিন্ন ব্যাসের দুটি পাইপ এটি দিয়ে জোড়া দেওয়া হয়।"},{"id":"9-55","paper":9,"n":55,"q":"পাইপের বাইরের প্যাঁচ (Threads) কাটার জন্য কোনটি উপযোগী (Appropriate)?","options":["ডাই স্টক","ডাই","ডাই স্টকসহ ডাই","ট্যাপ"],"answer":2,"explain":"ডাই প্যাঁচ কাটে আর ডাই স্টক হলো তাকে ধরে ঘোরানোর হাতল; দুটি একসাথে না হলে প্যাঁচ কাটা যায় না। ট্যাপ দিয়ে ভিতরের প্যাঁচ কাটা হয়।"},{"id":"9-56","paper":9,"n":56,"q":"পাইপের তরলের গতি (Flow) নিয়ন্ত্রণ করে কোনটি?","options":["রানিং নিপল","ভাল্ভ (Valve)","এক্সপানশন জয়েন্ট","রিডিউসার"],"answer":1,"explain":"ভাল্ভ খুলে-বন্ধ করে বা আংশিক খুলে পাইপের পানির প্রবাহ চালু, বন্ধ ও কমবেশি করা যায়। তাই প্রবাহ নিয়ন্ত্রণের ফিটিংস হলো ভাল্ভ।"},{"id":"9-57","paper":9,"n":57,"q":"রিডিউসার কীভাবে স্থাপন করা হয়?","options":["বড় লাইন থেকে ছোট লাইন নেওয়ার জন্য","ছোট লাইন থেকে বড় লাইন নেওয়ার জন্য","ছোট লাইন থেকে ছোট লাইন নেওয়ার জন্য","বড় লাইন থেকে বড় লাইন নেওয়ার জন্য"],"answer":0,"explain":"প্রধান বড় লাইন থেকে শাখা হিসেবে ছোট লাইনে পানি নিতে রিডিউসার বসানো হয়। প্রবাহের দিকে সাধারণত বড় থেকে ছোট সাইজে যাওয়া হয়।"},{"id":"9-58","paper":9,"n":58,"q":"OSH-এর পূর্ণ অর্থ কোনটি?","options":["Optional Safety habits","Occupational Safety habits","Occupational Safety and Health","Occupational Safe and Health"],"answer":2,"explain":"OSH মানে Occupational Safety and Health, অর্থাৎ পেশাগত নিরাপত্তা ও স্বাস্থ্য। কর্মক্ষেত্রে দুর্ঘটনা ও রোগ প্রতিরোধই এর উদ্দেশ্য।"},{"id":"9-59","paper":9,"n":59,"q":"পাঁচটি S-এর পূর্ণ নাম কী?","options":["Show, System, Swift, Standard and Safety","Show, Sleep, Swift, Standard and Self active","Sort, Systemize, Sweep, Standardize and Self discipline","Sort, Systemize, Swift, Standard and Self employed"],"answer":2,"explain":"5S হলো Sort (বাছাই), Systemize/Set in order (সাজানো), Sweep/Shine (পরিষ্কার), Standardize (মানসম্মত করা) ও Self discipline/Sustain (অভ্যাস ধরে রাখা)। প্রশ্নপত্রে Sweep-এর জায়গায় Swift ছাপা ছিল।"},{"id":"9-60","paper":9,"n":60,"q":"শ্রমিকদের নিরাপত্তাজনিত অনুশীলন অবহিত করতে যে ছবি ব্যবহার করা হয়ে থাকে তাকে কী বলে?","options":["সতর্কতা","নিষেধসমূহ","সাবধানতা","নিরাপত্তা চিহ্নসমূহ"],"answer":3,"explain":"কর্মক্ষেত্রের নিরাপত্তা বোঝাতে ব্যবহৃত ছবি বা প্রতীককে নিরাপত্তা চিহ্ন বলে। সতর্কতা, নিষেধ ইত্যাদি এর বিভিন্ন ধরন।"},{"id":"9-61","paper":9,"n":61,"q":"৯০ ডিগ্রি কোণ পরিমাপের জন্য কোনটি ব্যবহার করা হয়?","options":["স্পিরিট লেভেল","মেজারিং টেপ","স্টিল রুল","ট্রাই স্কয়ার"],"answer":3,"explain":"ট্রাই স্কয়ারের দুই বাহু পরস্পর ৯০ ডিগ্রিতে থাকে, তাই এটি দিয়ে সমকোণ মাপা ও পরীক্ষা করা হয়। পাইপের মাথা সোজা কাটা হয়েছে কিনা দেখতেও এটি লাগে।"},{"id":"9-62","paper":9,"n":62,"q":"ভিন্ন সাইজের পাইপ সংযোগ দেওয়ার জন্য কোন ফিটিংস ব্যবহার করা হয়?","options":["সকেট","এলবো","রিডিউসার","নিপল"],"answer":2,"explain":"রিডিউসারের দুই মুখ ভিন্ন সাইজের হওয়ায় বড় ও ছোট পাইপ একসাথে জোড়া দেওয়া যায়। সকেট শুধু একই সাইজের পাইপ জোড়ে।"},{"id":"9-63","paper":9,"n":63,"q":"একই সাইজের তিনটি পাইপ জয়েন্ট করার জন্য কোনটি ব্যবহার করা হয়?","options":["সকেট","ইকুয়াল টি","ক্রস","রিডিউসিং টি"],"answer":1,"explain":"ইকুয়াল টি-এর তিনটি মুখই একই সাইজের, তাই একই ব্যাসের তিনটি পাইপ জোড়া দেওয়া যায়। ক্রসে চারটি মুখ, রিডিউসিং টি-তে একটি মুখ ছোট।"},{"id":"9-64","paper":9,"n":64,"q":"PPE-এর পূর্ণ অর্থ কোনটি?","options":["Personal Protective Equipment","Personal Protection Equipment","Personal Protective Equipments","Person Protective Equipment"],"answer":0,"explain":"PPE মানে Personal Protective Equipment, অর্থাৎ ব্যক্তিগত সুরক্ষা সরঞ্জাম, যেমন হেলমেট, গ্লাভস, গগলস, সেফটি সু।"},{"id":"9-65","paper":9,"n":65,"q":"পাইপের থ্রেড কাটা হয় কোন স্ট্যান্ডার্ড পদ্ধতিতে?","options":["ব্রিটিশ স্ট্যান্ডার্ড পদ্ধতিতে","আমেরিকান স্ট্যান্ডার্ড পদ্ধতিতে","সিস্টেম পদ্ধতিতে","কোনোটিই নয়"],"answer":0,"explain":"বাংলাদেশে জিআই পাইপের প্যাঁচ ব্রিটিশ স্ট্যান্ডার্ড পাইপ থ্রেড (BSP) অনুযায়ী কাটা হয়। আমেরিকায় NPT ব্যবহৃত হয়।"},{"id":"9-66","paper":9,"n":66,"q":"½ ইঞ্চি ও ¾ ইঞ্চি একটি পাইপে ১ ইঞ্চির মধ্যে কয়টি প্যাঁচ থাকে?","options":["১১টি","১২টি","১৩টি","১৪টি"],"answer":3,"explain":"BSP স্ট্যান্ডার্ডে ½ ও ¾ ইঞ্চি পাইপে প্রতি ইঞ্চিতে ১৪টি প্যাঁচ (14 TPI) থাকে। ১ থেকে ২ ইঞ্চি পাইপে থাকে ১১টি।"},{"id":"9-67","paper":9,"n":67,"q":"একটি ত্রিভুজের একটি কোণ ৯০ ডিগ্রি, অপরটি ৩০ ডিগ্রি হলে অন্যটি কত?","options":["১১০ ডিগ্রি","৯০ ডিগ্রি","৬০ ডিগ্রি","৪৫ ডিগ্রি"],"answer":2,"explain":"ত্রিভুজের তিন কোণের যোগফল ১৮০ ডিগ্রি। তাই ১৮০ − (৯০ + ৩০) = ৬০ ডিগ্রি।"},{"id":"9-68","paper":9,"n":68,"q":"সাইফন সেটে আগত পানি অটো বন্ধ করে কোন ভাল্ভ?","options":["চেক ভাল্ভ","ফ্লোট ভাল্ভ","সেফটি ভাল্ভ","গেট ভাল্ভ"],"answer":1,"explain":"সিস্টার্ন ভরে গেলে ফ্লোট উপরে উঠে ফ্লোট ভাল্ভ নিজে থেকে পানি আসা বন্ধ করে দেয়। এজন্য একে অটোমেটিক ভাল্ভও বলা হয়।"},{"id":"9-69","paper":9,"n":69,"q":"নিচের কোনটি অনুসারে কাজ করা হয়?","options":["টুলস","মালামাল","ড্রয়িং","ছবি"],"answer":2,"explain":"ড্রয়িংয়ে পাইপ লাইনের রুট, মাপ, সাইজ ও ফিটিংসের অবস্থান দেওয়া থাকে। তাই প্লাম্বিংয়ের সব কাজ ড্রয়িং অনুসারে করা হয়।"},{"id":"9-70","paper":9,"n":70,"q":"নিচের কোনটি মেজারিং টুলস?","options":["মেজারিং টেপ","ট্রাই-স্কয়ার","স্কেল","সবগুলো"],"answer":3,"explain":"মেজারিং টেপ ও স্কেল দিয়ে দৈর্ঘ্য এবং ট্রাই-স্কয়ার দিয়ে সমকোণ মাপা হয়। তাই সবগুলোই পরিমাপের টুলস।"},{"id":"9-71","paper":9,"n":71,"q":"কাটিং অয়েল কী কাজে ব্যবহার করা হয়?","options":["পিভিসি পাইপ কাটার জন্য","ইউপিভিসি পাইপ কাটার জন্য","জিআই পাইপে প্যাঁচ কাটার সময় তাপ অপসারণের জন্য","পাইপে ফিটিংস ব্যবহারের জন্য"],"answer":2,"explain":"প্যাঁচ কাটার সময় ডাই ও পাইপের ঘর্ষণে তাপ তৈরি হয়। কাটিং অয়েল সেই তাপ কমায় ও ডাই পিচ্ছিল রাখে, ফ       bn(mcqCount) + 'টি বহুনির্বাচনী' + (list.length > mcqCount ? ' + ' + bn(list.length - mcqCount) + 'টি লিখিত' : '') +
      ' · সময় ' + bn(Math.round(seconds / 60)) + ' মিনিট</p>' +
      '<label for="nm" class="note">নাম</label><input id="nm" placeholder="আপনার নাম লিখুন" value="' + esc(savedName) + '"></div>' +
      '<div class="bar"><span id="prog">উত্তর: ০/' + bn(mcqCount) + '</span><span class="timer" id="tm"></span></div><div id="qs">';
    list.forEach(function (x, i) {
      var num = bn(i + 1) + '.';
      if (x.kind === 'mcq') {
        var it = x.it;
        h += '<div class="q" id="q' + i + '"><div class="qt">' + num + ' ' + esc(it.q) +
          (x.src ? ' <span class="src">(' + x.src + ')</span>' : '') + '</div>';
        it.options.forEach(function (o, k) {
          h += '<button type="button" class="opt" data-i="' + i + '" data-k="' + k + '"><span class="l">' + L[k] + ')</span><span>' + esc(o) + '</span></button>';
        });
        h += '<div class="exp hidden"></div></div>';
      } else {
        h += '<div class="q" id="q' + i + '"><div class="qt">' + num + ' ' + esc(x.q) + ' <span class="src">(লিখিত)</span></div>' +
          '<textarea data-w="' + i + '" placeholder="এখানে উত্তর লিখুন"></textarea><div class="exp hidden"><b>নমুনা উত্তর:</b> ' + esc(x.model) + '</div></div>';
      }
    });
    h += '</div><div id="res"></div><div class="row" id="actions">' +
      '<button type="button" class="btn green" id="submit" style="flex:1">জমা দিন</button></div>' +
      '<div class="row"><a class="btn" href="#/">← হোম</a></div>';
    app.innerHTML = h;
    window.scrollTo(0, 0);

    var nm = document.getElementById('nm');
    nm.addEventListener('input', function () { try { window.name = 'pl2name:' + nm.value; } catch (e) {} });
    var prog = document.getElementById('prog');
    function updProg() { prog.textContent = 'উত্তর: ' + bn(Object.keys(ans).length) + '/' + bn(mcqCount); }

    document.getElementById('qs').addEventListener('click', function (ev) {
      var b = ev.target.closest('.opt'); if (!b || done) return;
      var i = +b.dataset.i, k = +b.dataset.k;
      ans[i] = k;
      var box = document.getElementById('q' + i);
      box.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', +o.dataset.k === k); });
      updProg();
    });

    var tm = document.getElementById('tm');
    function tick() {
      var left = seconds - Math.floor((Date.now() - startedAt) / 1000);
      if (left <= 0) { tm.textContent = 'সময় শেষ'; submit(true); return; }
      var m = Math.floor(left / 60), s = left % 60;
      tm.textContent = 'সময়: ' + bn(m) + ':' + bn(s < 10 ? '0' + s : s);
      tm.classList.toggle('low', left <= 60);
    }
    tick(); timerHandle = setInterval(tick, 1000);

    document.getElementById('submit').addEventListener('click', function () {
      var un = mcqCount - Object.keys(ans).length;
      var b = this;
      if (un > 0 && !b.dataset.sure) {
        b.dataset.sure = '1';
        b.textContent = bn(un) + 'টি বাকি — নিশ্চিত? আবার চাপুন';
        setTimeout(function () { if (b.isConnected) { delete b.dataset.sure; b.textContent = 'জমা দিন'; } }, 5000);
        return;
      }
      submit(false);
    });

    function submit(auto) {
      if (done) return; done = true; stopTimer();
      var right = 0, wrong = 0, skip = 0;
      list.forEach(function (x, i) {
        if (x.kind !== 'mcq') return;
        if (!(i in ans)) skip++; else if (ans[i] === x.it.answer) right++; else wrong++;
      });
      document.getElementById('qs').classList.add('locked');
      document.querySelectorAll('textarea').forEach(function (t) { t.readOnly = true; });
      var used = Math.floor((Date.now() - startedAt) / 1000);
      var name = nm.value.trim(); nm.readOnly = true;
      var pct = mcqCount ? Math.round(right * 100 / mcqCount) : 0;
      var r = '<div class="result">' + (auto ? '<p><b>সময় শেষ — খাতা জমা হয়ে গেছে।</b></p>' : '') +
        '<div style="font-size:18px;font-weight:700">' + (name ? esc(name) + ' — ' : '') + 'ফলাফল</div>' +
        (mcqCount ? '<div class="stats"><div class="stat ok"><div class="n">' + bn(right) + '</div>সঠিক</div>' +
          '<div class="stat bad"><div class="n">' + bn(wrong) + '</div>ভুল</div>' +
          '<div class="stat skip"><div class="n">' + bn(skip) + '</div>বাদ</div></div>' +
          '<div>নম্বর: <b>' + bn(right) + '/' + bn(mcqCount) + '</b> (' + bn(pct) + '%) · সময় লেগেছে ' + bn(Math.floor(used / 60)) + ' মিনিট ' + bn(used % 60) + ' সেকেন্ড</div>'
          : '<div>লিখিত পরীক্ষা — নমুনা উত্তরের সাথে নিজে মিলিয়ে নিন।</div>') +
        (list.length > mcqCount && mcqCount ? '<p class="note">লিখিত প্রশ্নের নম্বর স্বয়ংক্রিয়ভাবে দেওয়া হয় না — নমুনা উত্তরের সাথে মিলিয়ে নিন।</p>' : '') +
        '</div>';
      document.getElementById('res').innerHTML = r;
      document.getElementById('actions').innerHTML =
        '<button type="button" class="btn fill" id="show" style="flex:1">সব উত্তর দেখুন</button>' +
        '<a class="btn green" id="again" href="#/again" style="flex:1">আবার দিন</a>';
      document.getElementById('again').addEventListener('click', function (e) {
        e.preventDefault();
        if (location.hash === retryHash) route(); else location.hash = retryHash;
      });
      document.getElementById('show').addEventListener('click', showAll);
      // written model answers appear right after submit
      list.forEach(function (x, i) { if (x.kind !== 'mcq') document.querySelector('#q' + i + ' .exp').classList.remove('hidden'); });
      document.getElementById('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showAll() {
      list.forEach(function (x, i) {
        if (x.kind !== 'mcq') return;
        var it = x.it, box = document.getElementById('q' + i), a = ans[i];
        var state = !(i in ans) ? 'skip' : (a === it.answer ? 'right' : 'wrong');
        box.classList.add(state === 'right' ? 'isright' : state === 'wrong' ? 'iswrong' : 'isskip');
        box.querySelectorAll('.opt').forEach(function (o) {
          var k = +o.dataset.k;
          if (k === it.answer) o.classList.add('right');
          else if (k === a) o.classList.add('wrong');
        });
        var qt = box.querySelector('.qt');
        qt.insertAdjacentHTML('beforeend', state === 'right' ? '<span class="tag ok">সঠিক</span>' : state === 'wrong' ? '<span class="tag bad">ভুল</span>' : '<span class="tag skip">বাদ</span>');
        var ex = box.querySelector('.exp');
        ex.innerHTML = '<b>সঠিক উত্তর: ' + L[it.answer] + ') ' + esc(it.options[it.answer]) + '</b><br>' + esc(it.explain);
        ex.classList.remove('hidden');
      });
      var s = document.getElementById('show'); s.disabled = true; s.textContent = 'সব উত্তর দেখানো হয়েছে';
      var first = document.querySelector('.q.iswrong') || document.querySelector('.q');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function mcqList(ids, showSrc) {
    return ids.map(function (id) { var it = byId[id]; return { kind: 'mcq', it: it, src: showSrc ? 'পেপার ' + bn(it.paper) : '' }; });
  }

  function notFound() { stopTimer(); app.innerHTML = '<p>পাতাটি পাওয়া যায়নি।</p><a class="btn" href="#/">← হোম</a>'; }

  function route() {
    var h = (location.hash || '#/').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    if (!parts.length) return home();
    var a = parts[0], n = parseInt(parts[1], 10);
    if (a === 'paper' && n >= 1 && n <= 10) {
      var P = D.papers[n];
      if (!P || (!P.mcq.length && !P.written.length)) { stopTimer(); app.innerHTML = '<p>এই পেপারের প্রশ্ন এখনো যোগ হয়নি।</p><a class="btn" href="#/">← হোম</a>'; return; }
      var list = mcqList(P.mcq, false).concat(P.written.map(function (w) { return { kind: 'written', q: w.q, model: w.model_answer }; }));
      return runTest('পেপার ' + bn(n) + ' পরীক্ষা', list, '#/paper/' + n);
    }
    if (a === 'model' && n >= 1 && n <= D.models.length) return runTest('মডেল টেস্ট ' + bn(n), mcqList(D.models[n - 1], true), '#/model/' + n);
    if (a === 'common' && D.common) return runTest('বেশি আসা প্রশ্ন — ' + bn(D.common.length) + 'টি', D.common.map(function (id) { return { kind: 'mcq', it: byId[id], src: bn(D.commonPapers[id].length) + 'টি পেপারে এসেছে — পেপার ' + D.commonPapers[id].map(bn).join(', ') }; }), '#/common');
    if (a === 'random' && !parts[1]) return randomPick();
    if (a === 'random' && [10, 20, 50, 100, 200].indexOf(n) >= 0) {
      var ids = shuffle(D.pool).slice(0, Math.min(n, D.pool.length));
      return runTest('র‍্যান্ডম প্র্যাকটিস — ' + bn(ids.length) + 'টি প্রশ্ন', mcqList(ids, true), '#/random/' + n);
    }
    if (a === 'exam') {
      var ex = D.exam.map(function (x) { return x.type === 'mcq' ? { kind: 'mcq', it: x } : { kind: 'written', q: x.q, model: x.model_answer }; });
      return runTest('৮০ প্রশ্নের পূর্ণ পরীক্ষা', ex, '#/exam');
    }
    notFound();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
